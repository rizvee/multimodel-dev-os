name: Publish GitHub Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@rizvee"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Build Freshness
        run: npm run check:build

      - name: Test
        run: npm test

      - name: Verify
        run: npm run verify
        env:
          MMDO_CI_VERIFICATION: "true"

      - name: Prepare GitHub Packages Staging
        run: node scripts/prepare-github-package.js

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        working-directory: .release/github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MMDO_ALLOW_PUBLISH: "true"
