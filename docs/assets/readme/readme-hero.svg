<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MultiModel Dev OS</title>
  <desc id="desc">Premium hero banner for MultiModel Dev OS showing one governed workspace connected to multiple AI coding tools.</desc>
  <defs>
