<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How MultiModel Dev OS works</title>
  <desc id="desc">Flow diagram from repository contracts through registries, validation, adapters, Skill OS, and the gateway foundation.</desc>
  <defs>
