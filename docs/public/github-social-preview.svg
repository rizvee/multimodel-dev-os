      <rect width="460" height="80" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="30" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">LOCALHOST GATEWAY FOUNDATION</text>
