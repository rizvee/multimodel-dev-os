    <path d="M 160 0 L 160 640 M 320 0 L 320 640 M 480 0 L 480 640 M 640 0 L 640 640 M 800 0 L 800 640 M 960 0 L 960 640 M 1120 0 L 1120 640"/>
  </g>

  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="480" r="220" fill="#06b6d4" opacity="0.09" filter="url(#glow)"/>

  <rect x="24" y="24" width="1232" height="592" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

